<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Media Showcase</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --accent-gradient: linear-gradient(90deg, #6366f1, #a855f7);
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .container {
            max-width: 800px;
            width: 100%;
            text-align: center;
        }

        /* Large Typography & Generous Whitespace */
        h1 {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 1.5rem;
            letter-spacing: -0.05em;
        }

        .gradient-text {
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 1.25rem;
            color: var(--text-muted);
            margin-bottom: 4rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.6;
        }

        /* Glassmorphism Card & Soft Shadows */
        .showcase-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .showcase-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
        }

        /* Media Container */
        .media-wrapper {
            position: relative;
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 2.5rem;
            background: #000;
            aspect-ratio: 16 / 9;
        }

        .media-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Strong Contrast Call-to-Action Button */
        .cta-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--accent-gradient);
            color: #ffffff;
            font-size: 1.125rem;
            font-weight: 600;
            text-decoration: none;
            padding: 1rem 2.5rem;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .cta-button:hover {
            opacity: 0.95;
            transform: scale(1.02);
        }

        .cta-button:active {
            transform: scale(0.98);
        }

        .icon {
            margin-left: 0.5rem;
            width: 20px;
            height: 20px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Typography -->
        <h1>Featured <span class="gradient-text">Showcase</span></h1>
        <p>Experience high-quality media rendering seamlessly integrated with a modern glassmorphic interface.</p>

        <!-- Rounded Card with Soft Shadows -->
        <div class="showcase-card">
            <!-- Media Component -->
            <div class="media-wrapper">
                <!-- Replace src with your specific looping media or GIF URL -->
                <img src="https://digiskills52.wordpress.com/wp-content/uploads/2026/09/58417449.gif" alt="Abstract placeholder animation/image">
            </div>

            <!-- Redirection Button -->
            <a href="www.instagram.com" target="_blank" rel="noopener noreferrer" class="cta-button">
                Visit External Site
                <!-- Consistent SVG Iconography -->
                <svg class="icon" viewBox="0 0 20 20">
                    <path d="M11 3a1 1 0 100 2h2.586l-6.293 6.293a1 1 0 101.414 1.414L15 6.414V9a1 1 0 102 0V4a1 1 0 00-1-1h-5z" />
                    <path d="M5 5a2 2 0 00-2 2v8a2 2 0 002 2h8a2 2 0 002-2v-3a1 1 0 10-2 0v3H5V7h3a1 1 0 000-2H5z" />
                </svg>
            </a>
        </div>
    </div>

</body>
</html>
