<div class="showcase-container">
  <header class="showcase-header">
    <h1>Visual <span class="gradient-text">Showcase</span></h1>
    <p>A curated collection of 50 high-quality motion graphics and looping animations.</p>
  </header>

  <div class="showcase-grid" id="gif-grid">
    <!-- The 50 items are generated via JavaScript below for clean code -->
  </div>
</div>

<style>
  /* Base Styles & Theme Variables */
  :root {
    --bg-gradient: linear-gradient(135deg, #0f0c1b 0%, #201335 50%, #07050f 100%);
    --card-bg: rgba(255, 255, 255, 0.03);
    --card-border: rgba(255, 255, 255, 0.08);
    --text-main: #f3f4f6;
    --text-muted: #9ca3af;
    --accent-start: #ff416c;
    --accent-end: #ff4b2b;
    --radius: 16px;
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  }

  .showcase-container {
    background: var(--bg-gradient);
    min-height: 100vh;
    padding: 4rem 2rem;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text-main);
  }

  /* Large Typography & Generous Whitespace */
  .showcase-header {
    text-align: center;
    max-width: 800px;
    margin: 0 auto 5rem auto;
  }

  .showcase-header h1 {
    font-size: 3.5rem;
    font-weight: 800;
    letter-spacing: -0.04em;
    margin-bottom: 1.5rem;
    line-height: 1.1;
  }

  /* Gradient Accents */
  .gradient-text {
    background: linear-gradient(to right, var(--accent-start), var(--accent-end));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .showcase-header p {
    font-size: 1.25rem;
    color: var(--text-muted);
    line-height: 1.6;
  }

  /* Layout Grid */
  .showcase-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 2.5rem;
    max-width: 1400px;
    margin: 0 auto;
  }

  /* Rounded Cards & Glassmorphism */
  .gif-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 12px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: var(--shadow);
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), border-color 0.3s ease;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .gif-card:hover {
    transform: translateY(-8px);
    border-color: rgba(255, 65, 108, 0.4);
  }

  /* High-Quality Imagery Container */
  .gif-wrapper {
    position: relative;
    width: 100%;
    padding-top: 100%; /* 1:1 Aspect Ratio */
    background: rgba(0, 0, 0, 0.2);
    border-radius: calc(var(--radius) - 4px);
    overflow: hidden;
  }

  .gif-wrapper img {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* Soft Shadows & Typography Contrast */
  .gif-meta {
    padding: 1rem 0.5rem 0.5rem 0.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .gif-title {
    font-size: 1rem;
    font-weight: 600;
    color: var(--text-main);
    margin: 0;
  }

  /* Consistent Iconography */
  .gif-icon {
    width: 20px;
    height: 20px;
    fill: var(--text-muted);
    opacity: 0.7;
  }

  .gif-card:hover .gif-icon {
    fill: var(--accent-start);
    opacity: 1;
  }

  /* Responsive Adjustments */
  @media (max-width: 768px) {
    .showcase-header h1 { font-size: 2.5rem; }
    .showcase-container { padding: 2rem 1rem; }
    .showcase-grid { gap: 1.5rem; }
  }
</style>

<script>
  // Configuration: Replace these placeholder URLs with your actual direct GIF image URLs
  const GIF_DATA = Array.from({ length: 50 }, (_, i) => ({
    title: `Item Showcase #${i + 1}`,
    // Replace the URL below with your real hosted .gif or video loop links
    url: `https://digiskills52.wordpress.com/wp-content/uploads/2026/09/tumblr_mek4xr3d3p1ryji6oo1_500.gif` 
  }));

  const gridContainer = document.getElementById('gif-grid');

  // SVG Icon Markup for consistent styling
  const eyeIcon = `
    <svg class="gif-icon" viewBox="0 0 24 24">
      <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
    </svg>
  `;

  // Dynamically render the 50 elements safely
  GIF_DATA.forEach(item => {
    const card = document.createElement('div');
    card.className = 'gif-card';

    card.innerHTML = `
      <div class="gif-wrapper">
        <img src="${item.url}" alt="${item.title}" loading="lazy">
      </div>
      <div class="gif-meta">
        <h3 class="gif-title">${item.title}</h3>
        ${eyeIcon}
      </div>
    `;

    gridContainer.appendChild(card);
  });
</script>
