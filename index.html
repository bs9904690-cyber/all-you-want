<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Media Showcase - 50 Items</title>
    <!-- Google Fonts for Large Typography -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        /* Consistent Color Palette & Design Tokens */
        :root {
            --bg-main: #0b0f19;
            --bg-card: rgba(255, 255, 255, 0.03);
            --border-glass: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --gradient-accent: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
            --shadow-soft: 0 20px 40px rgba(0, 0, 0, 0.3);
            --radius-lg: 24px;
            --radius-md: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
            padding-bottom: 100px;
        }

        /* Ambient Gradient Accent Background */
        body::before {
            content: '';
            position: absolute;
            top: -10%;
            left: 50%;
            transform: translateX(-50%);
            width: 80vw;
            height: 50vh;
            background: radial-gradient(circle, rgba(255, 65, 108, 0.15) 0%, rgba(11, 15, 25, 0) 70%);
            z-index: -1;
            pointer-events: none;
        }

        /* Navigation Header with Glassmorphism */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            background: rgba(11, 15, 25, 0.7);
            border-bottom: 1px solid var(--border-glass);
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: var(--gradient-accent);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Hero Section with Large Typography & Generous Whitespace */
        .hero {
            max-width: 1200px;
            margin: 80px auto 60px auto;
            padding: 0 24px;
            text-align: center;
        }

        .hero h1 {
            font-size: 3.5rem;
            font-weight: 800;
            line-height: 1.2;
            letter-spacing: -2px;
            margin-bottom: 24px;
        }

        .hero h1 span {
            background: var(--gradient-accent);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            font-size: 1.25rem;
            color: var(--text-secondary);
            max-width: 600px;
            margin: 0 auto;
        }

        /* Showcase Grid Layout */
        .showcase-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 32px; /* Generous Whitespace */
        }

        /* Rounded Cards with Soft Shadows & Glassmorphism Selectively */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-soft);
            transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), border-color 0.3s ease;
            position: relative;
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: rgba(255, 65, 108, 0.3);
        }

        /* Media Container for Videos */
        .media-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            background-color: #000;
            overflow: hidden;
        }

        .media-container video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Visual Tag Anchors */
        .badge {
            position: absolute;
            top: 16px;
            left: 16px;
            background: rgba(11, 15, 25, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--border-glass);
            padding: 6px 12px;
            border-radius: var(--radius-md);
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            z-index: 2;
        }

        /* Card Content & Typography */
        .card-content {
            padding: 24px;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .views-count {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Custom Responsive Iconography via CSS */
        .icon-play {
            width: 12px;
            height: 12px;
            background-color: var(--text-secondary);
            clip-path: polygon(0% 0%, 100% 50%, 0% 100%);
            display: inline-block;
        }

        /* Responsive Breakpoints */
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2.5rem;
            }
            .grid {
                grid-template-columns: 1fr;
                gap: 24px;
            }
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header>
        <div class="logo">VIVID.</div>
    </header>

    <!-- Hero Header -->
    <section class="hero">
        <h1>Premium <span>Cinematic</span> Showcase</h1>
        <p>Experience ultra high-definition playback wrapped in a completely distraction-free, fluid interface.</p>
    </section>

    <!-- Content Showcase Grid -->
    <main class="showcase-container">
        <div class="grid" id="mediaGrid">
            <!-- 50 Video items will be injected here automatically by JavaScript -->
        </div>
    </main>

    <script>
        // Sample premium stock video URLs to loop through for the 50 items
        const videoPool = [
            "https://digiskills52.wordpress.com/wp-content/uploads/2026/09/tumblr_mek4xr3d3p1ryji6oo1_500.gif",
            "https://digiskills52.wordpress.com/wp-content/uploads/2026/09/tumblr_mek4xr3d3p1ryji6oo1_500.gif",
            "https://digiskills52.wordpress.com/wp-content/uploads/2026/09/tumblr_mek4xr3d3p1ryji6oo1_500.gif"
        ];

        const grid = document.getElementById('mediaGrid');

        // Loop to generate 50 distinct items
        for (let i = 1; i <= 50; i++) {
            // Pick a video from our pool using the remainder operator
            const videoUrl = videoPool[i % videoPool.length];
            
            // Random numbers for premium metadata mockups
            const views = (Math.random() * (500 - 10) + 10).toFixed(1);
            const durationMin = Math.floor(Math.random() * 15) + 3;
            const durationSec = Math.floor(Math.random() * 50) + 10;
            const badgeText = i % 2 === 0 ? "4K Ultra" : "HD Premium";

            // Generate HTML structure for each individual card
            const cardHTML = `
                <div class="card">
                    <span class="badge">${badgeText}</span>
                    <div class="media-container">
                        <video muted loop autoplay playsinline preload="auto">
                            <source src="${videoUrl}" type="video/mp4">
                        </video>
                    </div>
                    <div class="card-content">
                        <h3 class="card-title">Premium Cinematic Sequence #${i}</h3>
                        <div class="card-meta">
                            <span class="views-count"><i class="icon-play"></i> ${views}K views</span>
                            <span>${durationMin}:${durationSec}</span>
                        </div>
                    </div>
                </div>
            `;
            
            // Inject card into the CSS Grid container
            grid.innerHTML += cardHTML;
        }
    </script>
</body>
</html>
