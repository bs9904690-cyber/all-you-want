<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Media Showcase</title>
    <!-- Google Fonts for Large Typography -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        /* Consistent Color Palette & Design Tokens */
        :root {
            --bg-main: #0b0f19;
            --bg-card: rgba(255, 255, 255, 0.03);
            --border-glass: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --gradient-accent: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
            --shadow-soft: 0 20px 40px rgba(0, 0, 0, 0.3);
            --radius-lg: 24px;
            --radius-md: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
            padding-bottom: 100px;
        }

        /* Ambient Gradient Accent Background */
        body::before {
            content: '';
            position: absolute;
            top: -10%;
            left: 50%;
            transform: translateX(-50%);
            width: 80vw;
            height: 50vh;
            background: radial-gradient(circle, rgba(255, 65, 108, 0.15) 0%, rgba(11, 15, 25, 0) 70%);
            z-index: -1;
            pointer-events: none;
        }

        /* Navigation Header with Glassmorphism */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            background: rgba(11, 15, 25, 0.7);
            border-bottom: 1px solid var(--border-glass);
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: var(--gradient-accent);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Hero Section with Large Typography & Generous Whitespace */
        .hero {
            max-width: 1200px;
            margin: 80px auto 60px auto;
            padding: 0 24px;
            text-align: center;
        }

        .hero h1 {
            font-size: 3.5rem;
            font-weight: 800;
            line-height: 1.2;
            letter-spacing: -2px;
            margin-bottom: 24px;
        }

        .hero h1 span {
            background: var(--gradient-accent);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            font-size: 1.25rem;
            color: var(--text-secondary);
            max-width: 600px;
            margin: 0 auto;
        }

        /* Showcase Grid Layout */
        .showcase-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 32px; /* Generous Whitespace */
        }

        /* Rounded Cards with Soft Shadows & Glassmorphism Selectively */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-soft);
            transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), border-color 0.3s ease;
            position: relative;
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: rgba(255, 65, 108, 0.3);
        }

        /* Media Container for Videos and GIFs */
        .media-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            background-color: #000;
            overflow: hidden;
        }

        .media-container video, 
        .media-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Visual Tag Anchors */
        .badge {
            position: absolute;
            top: 16px;
            left: 16px;
            background: rgba(11, 15, 25, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--border-glass);
            padding: 6px 12px;
            border-radius: var(--radius-md);
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            z-index: 2;
        }

        /* Card Content & Typography */
        .card-content {
            padding: 24px;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-primary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .views-count {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Custom Responsive Iconography via CSS */
        .icon-play {
            width: 12px;
            height: 12px;
            background-color: var(--text-secondary);
            clip-path: polygon(0% 0%, 100% 50%, 0% 100%);
            display: inline-block;
        }

        /* Responsive Breakpoints */
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2.5rem;
            }
            .grid {
                grid-template-columns: 1fr;
                gap: 24px;
            }
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header>
        <div class="logo">VIVID.</div>
    </header>

    <!-- Hero Header -->
    <section class="hero">
        <h1>Premium <span>Cinematic</span> Showcase</h1>
        <p>Experience ultra high-definition playback wrapped in a completely distraction-free, fluid interface.</p>
    </section>

    <!-- Content Showcase -->
    <main class="showcase-container">
        <div class="grid">

            <!-- Card 1: Autoplay Video Item -->
            <div class="card">
                <span class="badge">4K Ultra</span>
                <div class="media-container">
                    <!-- Standard video node configured to auto-play loops elegantly -->
                    <video muted loop autoplay playsinline preload="auto">
                        <source src="https://mixkit.co" type="video/mp4">
                    </video>
                </div>
                <div class="card-content">
                    <h3 class="card-title">Neon Geometry Motion</h3>
                    <div class="card-meta">
                        <span class="views-count"><i class="icon-play"></i> 142K views</span>
                        <span>12:45</span>
                    </div>
                </div>
            </div>

            <!-- Card 2: High-Quality GIF/Animation Item -->
            <div class="card">
                <span class="badge">Looping GIF</span>
                <div class="media-container">
                    <!-- High-quality visual loop placeholder -->
                    <img src="https://giphy.com" alt="Abstract Loop Visual">
                </div>
                <div class="card-content">
                    <h3 class="card-title">Monochrome Horizon</h3>
                    <div class="card-meta">
                        <span class="views-count"><i class="icon-play"></i> 89K views</span>
                        <span>Infinite</span>
                    </div>
                </div>
            </div>

            <!-- Card 3: Autoplay Video Item 2 -->
            <div class="card">
                <span class="badge">HD Premium</span>
                <div class="media-container">
                    <video muted loop autoplay playsinline preload="auto">
                        <source src="https://mixkit.co" type="video/mp4">
                    </video>
                </div>
                <div class="card-content">
                    <h3 class="card-title">Liquid Iridescence</h3>
                    <div class="card-meta">
                        <span class="views-count"><i class="icon-play"></i> 2.4M views</span>
                        <span>08:12</span>
                    </div>
                </div>
            </div>

        </div>
    </main>

</body>
</html>
