<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Showcase Portfolio</title>
    <!-- Tailwind CSS for layout & utility styling -->
    <script src="https://jsdelivr.net"></script>
    <style>
        /* Custom styles for elements requiring precise glassmorphism and shadows */
        .glass-header {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .glass-card {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.03);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            transform: translateY(-6px);
            border-color: rgba(244, 63, 94, 0.4); /* Accent color on hover */
            box-shadow: 0 20px 40px -15px rgba(244, 63, 94, 0.15);
        }

        .soft-shadow {
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans selection:bg-rose-500 selection:text-white">

    <!-- Glassmorphic Header -->
    <header class="sticky top-0 z-50 glass-header px-6 py-4 md:px-12">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="text-2xl font-black tracking-wider bg-gradient-to-r from-rose-500 to-violet-500 bg-clip-text text-transparent">
                VAULT<span class="text-slate-400 font-light">50</span>
            </div>
            <nav class="flex gap-6 text-sm font-medium text-slate-400">
                <a href="#" class="hover:text-rose-400 transition-colors">Trending</a>
                <a href="#" class="hover:text-rose-400 transition-colors">Categories</a>
            </nav>
        </div>
    </header>

    <!-- Hero Section / Large Typography -->
    <main class="max-w-7xl mx-auto px-6 pt-20 pb-32 md:px-12">
        <section class="mb-20 text-center md:text-left max-w-3xl">
            <h1 class="text-5xl md:text-7xl font-extrabold tracking-tight leading-none mb-6">
                Curated <br class="hidden md:inline">
                <span class="bg-gradient-to-r from-rose-400 via-fuchsia-500 to-violet-500 bg-clip-text text-transparent">
                    Visual Motion.
                </span>
            </h1>
            <p class="text-lg md:text-xl text-slate-400 font-light leading-relaxed">
                A premium, high-contrast gallery featuring 50 seamless looping showcases. Experience fluid motion built with micro-interactions and immersive glassmorphic design.
            </p>
        </section>

        <!-- Media Grid -->
        <div id="gallery-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8">
            <!-- Dynamically populated by JS -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-900 bg-slate-990 py-12 text-center text-sm text-slate-600">
        <p>&copy; 2026 Vault50. All rights reserved.</p>
    </footer>

    <script>
        // Array configuration for 50 items
        const TOTAL_ITEMS = 50;
        const gridContainer = document.getElementById('gallery-grid');

        // Sample array of high-quality looping placeholder videos/GIFs 
        // Replace these URLs with your specific media asset directories or arrays
        const sampleMedia = [
            "https://digiskills52.wordpress.com/wp-content/uploads/2026/09/tumblr_mek4xr3d3p1ryji6oo1_500.gif",
            "https://digiskills52.wordpress.com/wp-content/uploads/2026/09/tumblr_mek4xr3d3p1ryji6oo1_500.gif",
            "https://digiskills52.wordpress.com/wp-content/uploads/2026/09/tumblr_mek4xr3d3p1ryji6oo1_500.gif",
            "https://digiskills52.wordpress.com/wp-content/uploads/2026/09/tumblr_mek4xr3d3p1ryji6oo1_500.gif"
        ];

        // Generate 50 items dynamically
        for (let i = 1; i <= TOTAL_ITEMS; i++) {
            // Cycle through available sample media URLs
            const mediaUrl = sampleMedia[(i - 1) % sampleMedia.length];
            
            // Create Card Wrapper
            const card = document.createElement('div');
            card.className = 'glass-card rounded-2xl overflow-hidden soft-shadow flex flex-col group';

            // HTML Structure for each item incorporating consistent iconography and typography
            card.innerHTML = `
                <!-- Media Container (Autoplay loop) -->
                <div class="relative aspect-[4/3] bg-slate-900 overflow-hidden">
                    <video 
                        src="${mediaUrl}" 
                        autoplay 
                        loop 
                        muted 
                        playsinline 
                        class="w-full h-full object-cover opacity-80 group-hover:opacity-100 group-hover:scale-105 transition-all duration-700 ease-out"
                    ></video>
                    <!-- Gradient accent badge overlay -->
                    <span class="absolute top-3 right-3 text-[10px] tracking-widest uppercase font-bold px-2.5 py-1 rounded-full bg-gradient-to-r from-rose-500/20 to-violet-500/20 text-rose-400 border border-rose-500/30 backdrop-blur-md">
                        Loop ${i}
                    </span>
                </div>
                
                <!-- Content / Info Area -->
                <div class="p-5 flex flex-col justify-between flex-grow">
                    <div>
                        <h3 class="text-md font-semibold text-slate-200 tracking-wide mb-1 group-hover:text-white transition-colors">
                            Premium Asset #${String(i).padStart(2, '0')}
                        </h3>
                        <p class="text-xs text-slate-400 font-light tracking-wide">
                            Categorized / High-Framerate
                        </p>
                    </div>
                    
                    <!-- Icon Action Bar with strong contrast -->
                    <div class="mt-4 pt-4 border-t border-slate-800/60 flex justify-between items-center text-slate-400">
                        <button class="hover:text-rose-400 transition-colors flex items-center gap-1.5 text-xs">
                            <svg xmlns="http://w3.org" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
                            </svg>
                            <span>${Math.floor(Math.random() * 900) + 100}</span>
                        </button>
                        <button class="hover:text-slate-200 transition-colors">
                            <svg xmlns="http://w3.org" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" />
                            </svg>
                        </button>
                    </div>
                </div>
            `;
            
            gridContainer.appendChild(card);
        }
    </script>
</body>
</html>
